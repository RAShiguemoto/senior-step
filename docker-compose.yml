# docker-compose.yml (Para uso LOCAL na sua máquina)
services:
  db:
    image: postgres:17-alpine
    container_name: seniorstep-db-local
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: seniorstep_db
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data

volumes:
  postgres_data_local: