spring:
  docker:
     compose:
       enabled: false

  datasource:
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop # ESSENCIAL: Cria as tabelas no Postgres do Docker
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Dialeto correto para o Hibernate falar a língua do Postgres
        dialect: org.hibernate.dialect.PostgreSQLDialect

api:
