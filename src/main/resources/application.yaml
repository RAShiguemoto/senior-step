spring:
  application:
    name: senior-step

  datasource:
    url: jdbc:postgresql://localhost:5432/seniorstep_db
    username: devuser
    password: devpassword
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

api:
  telegram:
    token: ${TELEGRAM_TOKEN:dummy-token}
    chat-id: ${TELEGRAM_CHAT_ID:123456}
